      <path d="M 0 0 L 6 3 L 0 6" fill="none" stroke="#0a0a0a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0a0a0a; }
    .secondary { fill: #696969; }
    .time { font-variant-numeric: tabular-nums; }
  </style>
